<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>能力集市 · Home Agent</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<header class="top">
  <div class="top__main">
    <h1>能力集市 <span class="muted">home-agent</span></h1>
    <p id="source" class="muted small">加载中…</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<nav class="toolbar">
  <input id="q" class="search" type="search" placeholder="搜能力 / 触发语 / 参数 / 服务…（按 / 聚焦，空格分隔=AND）" autocomplete="off" />
  <select id="group" title="类别 group"></select>
  <select id="kind" title="kind"></select>
  <select id="service" title="声明服务"></select>
  <select id="keyword" title="关键字（人工设定）"></select>
  <select id="host" title="适用宿主"></select>
  <select id="status" title="声明特征">
    <option value="all">全部</option>
    <option value="conditional">条件挂载</option>
    <option value="preflight">有执行前自检</option>
    <option value="documented">有文档包</option>
    <option value="composite">组合能力</option>
    <option value="unowned">无服务归属</option>
    <option value="no_docs">缺文档</option>
  </select>
  <select id="sort" title="排序">
    <option value="relevance">相关性 / 默认</option>
    <option value="group">按 group</option>
    <option value="updated">最近维护优先</option>
  </select>
  <button id="reset" class="btn">重置</button>
</nav>

<main class="layout">
  <section class="list" id="list" aria-live="polite"></section>
  <aside class="detail" id="detail">
    <div class="empty">选一条能力看详情</div>
  </aside>
</main>

<footer class="foot">
  <span id="count" class="muted small"></span>
  <span id="imports" class="muted small"></span>
  <a href="../catalog/capabilities.md">总表 (md)</a>
  <a href="../catalog/capabilities.json">catalog (json)</a>
  <a href="../schema/catalog.schema.json">schema</a>
  <a href="../README.md">怎么维护</a>
</footer>

<script src="assets/catalog-core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
