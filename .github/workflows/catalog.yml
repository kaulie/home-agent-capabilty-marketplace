name: catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    name: 目录自检 + 服务端测试 + UI 逻辑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 目录自洽（schema / 每页 md / 计数 / 账不平 / UI 资源）
        run: python3 tests/catalog-schema.test.py
      - name: 服务端（导入/查询/注解/API + socket 冒烟）
        run: python3 -m unittest discover -s server/tests -t .
      - name: UI 核心逻辑（查询/筛选/排序/高亮）
        run: node --test tests/*.test.mjs
      - name: 服务能起来并响应 /health
        run: |
          python3 server/catalog_cli.py --db /tmp/ci.sqlite3 import catalog/capabilities.json >/dev/null
          python3 server/catalog_cli.py --db /tmp/ci.sqlite3 serve --host 127.0.0.1 --port 4250 >/tmp/ci.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4250/health
          curl -fsS 'http://127.0.0.1:4250/api/v1/capabilities?q=pdf&limit=1' >/dev/null
          kill %1

  drift:
    name: 与 home-agent-os 代码对账（不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: clone home-agent-os（公开仓库）
        run: git clone --depth 1 https://github.com/kaulie/home-agent-os /tmp/home-agent-os
      - name: 代码改了但目录没更新？
        run: |
          python3 /tmp/home-agent-os/mac/scripts/export_capability_catalog.py --out /tmp/code
          python3 server/catalog_cli.py --db /tmp/drift.sqlite3 import /tmp/code/catalog/capabilities.json >/dev/null
          python3 server/catalog_cli.py --db /tmp/drift.sqlite3 export --out /tmp/drift.json >/dev/null
          python3 tests/catalog-drift.py /tmp/drift.json catalog/capabilities.json \
            || echo "::warning::能力目录与 home-agent-os main 有漂移 —— 跑 scripts/sync.sh 更新（详见输出）"
