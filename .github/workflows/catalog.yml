name: catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    name: 目录自检 + 服务端测试 + UI 逻辑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 目录自洽（schema / 每页 md / 计数 / 账不平 / UI 资源）
        run: python3 tests/catalog-schema.test.py
      - name: 本仓导出器（不读 os）
        run: python3 -m unittest tests.test_export_catalog
      - name: 服务端（导入/查询/注解/API + socket 冒烟）
        run: python3 -m unittest discover -s server/tests -t .
      - name: UI 核心逻辑（查询/筛选/排序/高亮）
        run: node --test tests/*.test.mjs
      - name: 服务能起来并响应 /health
        run: |
          python3 server/catalog_cli.py --db /tmp/ci.sqlite3 import catalog/capabilities.json >/dev/null
          python3 server/catalog_cli.py --db /tmp/ci.sqlite3 serve --host 127.0.0.1 --port 4250 >/tmp/ci.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4250/health
          curl -fsS 'http://127.0.0.1:4250/api/v1/capabilities?q=pdf&limit=1' >/dev/null
          kill %1

  drift:
    name: 与本仓声明对账
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 本仓 plugins/ + declarations/ 与 catalog 对账
        run: bash scripts/sync.sh --check
